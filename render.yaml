services:
  - type: web
    name: taskflow-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node --experimental-strip-types src/index.ts
    healthCheckPath: /api/tasks
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/taskflow.db
    disk:
      name: taskflow-data
      mountPath: /var/data
      sizeGB: 1
